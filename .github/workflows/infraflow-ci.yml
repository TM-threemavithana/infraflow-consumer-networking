name: "Networking Infrastructure CI"

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "infraflow.config.yaml"
      - ".github/workflows/infraflow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-speculative-plan:
    name: "AWS Speculative Plan (Cloud-Free)"
    uses: TM-threemavithana/infraflow/.github/workflows/reusable-tf-aws.yml@8fd761bb42165435e1162f37ee39df15d5532b09
    with:
      aws-region: "us-east-1"
      terraform-version: "1.10.4"
      working-directory: "terraform"
      environment: "dev"
      backend-bucket: "net-infraflow-tfstate"
      backend-key: "env/dev/terraform.tfstate"
      enable-aws-auth: false

name: "Networking Infrastructure CI"

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "infraflow.config.yaml"
      - ".github/workflows/infraflow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-gate:
    name: "InfraFlow Governance Gate"
    uses: TM-threemavithana/infraflow/.github/workflows/reusable-tf-governance.yml@1630e61952c99460b37eb775c11b190d0e1ab81f
    with:
      config-file: "infraflow.config.yaml"
      working-directory: "."
      platform-sha: "1630e61952c99460b37eb775c11b190d0e1ab81f"
      expected-adapter: "aws"

  aws-speculative-plan:
    name: "AWS Speculative Plan (Cloud-Free)"
    needs: [governance-gate]
    uses: TM-threemavithana/infraflow/.github/workflows/reusable-tf-aws.yml@1630e61952c99460b37eb775c11b190d0e1ab81f
    with:
      aws-region: "us-east-1"
      terraform-version: "1.10.4"
      working-directory: "terraform"
      environment: "dev"
      backend-bucket: "net-infraflow-tfstate"
      backend-key: "env/dev/terraform.tfstate"
      enable-aws-auth: false
